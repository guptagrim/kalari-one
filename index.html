<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalari Studios — Coming Soon</title>
  <meta name="description" content="Kalari Studios is launching soon.">
  <meta name="author" content="Kalari Studios">
  <meta property="og:title" content="Kalari Studios — Coming Soon">
  <meta property="og:description" content="Kalari Studios is launching soon.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Background music: best-effort autoplay, falls back to starting on the
     first user interaction if the browser blocks it (see initMusic in
     main.js) — no visible controls, driven entirely by #mute-btn. -->
<audio id="bg-music" src="public/audio/zen.mp3" loop preload="auto"></audio>

<!-- ── PAGE ──────────────────────────────────────────────── -->
<div class="page">

  <header class="site-header">
    <span class="wordmark">Kalari Studios</span>

    <div class="toolbar">
      <button type="button" id="mute-btn" class="glass-btn" aria-pressed="false" aria-label="Mute background music">
        <span class="eq-bars" aria-hidden="true">
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
        </span>
      </button>

      <button type="button" id="cart-btn" class="glass-btn" aria-label="View cart">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="19" cy="21" r="1"/>
          <path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.8h7.7a2 2 0 0 0 2-1.6L21 8H6.2"/>
        </svg>
        <span class="cart-count" id="cart-count" hidden>0</span>
      </button>
    </div>
  </header>

  <main class="hero">
    <p class="eyebrow">Coming Soon</p>
    <h1 class="headline">Kalari Studios</h1>
    <p class="tagline">Clothing that moves with you.</p>

    <p class="launch-date">Launching September 14, 2026</p>

    <form id="notify-form" class="notify-form">
      <label for="notify-email" class="visually-hidden">Email address</label>
      <div class="stitch-wrap">
        <input id="notify-email" type="email" name="email" placeholder="Your email address" required>
      </div>
      <button type="submit">
        <span class="btn-label">Notify me</span>
      </button>
    </form>
    <p id="notify-status" class="notify-status" role="status" aria-live="polite"></p>
  </main>

  <footer class="site-footer">
    <span>&copy; <span id="year"></span> Kalari Studios</span>
    <a href="#" target="_blank" rel="noopener">Instagram</a>
  </footer>

</div>

<p id="toast" class="toast" role="status" aria-live="polite"></p>

<script src="main.js"></script>
</body>
</html>
